name: 🎽 CI

on:
  push:
    branches:
      - main
    paths:
      - "**.go"
      - go.mod
      - go.sum
      - .goreleaser.yml
      - .github/workflows/ci.yml
  pull_request:
    paths:
      - "**.go"
      - go.mod
      - go.sum
      - .goreleaser.yml
      - .github/workflows/ci.yml

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  lint-check:
    name: 🧹 Lint Check
    permissions:
      contents: read
    runs-on: ubuntu-slim
    timeout-minutes: 2

    steps:
      - name: 🚚 Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: 🐹 Set up Go
        id: setup-go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: 📦 Install dependencies
        if: ${{ steps.setup-go.outputs.cache-hit != 'true' }}
        run: go mod download

      - name: 🛡️ Run golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0

  format-check:
    name: 📝 Format Check
    permissions:
      contents: read
    runs-on: Ubuntu-Slim
    timeout-minutes: 2

    steps:
      - name: 🚚 Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: 🐹 Set up Go
        id: setup-go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: 🛡️ Install golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          install-only: true

      - name: 📝 Format check
        run: golangci-lint fmt -d

  static-analysis:
    name: 📊 Static Analysis
    permissions:
      contents: read
    runs-on: Ubuntu-Slim
    timeout-minutes: 2

    steps:
      - name: 🚚 Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: 🐹 Set up Go
        id: setup-go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: 📦 Install dependencies
        if: ${{ steps.setup-go.outputs.cache-hit != 'true' }}
        run: go mod download

      - name: 📊 Static analysis
        run: go vet -v ./...

  test:
    name: 🧪 Test
    permissions:
      contents: read
    runs-on: macOS-26
    environment:
      name: CI
      deployment: false
    timeout-minutes: 2

    steps:
      - name: 🚚 Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: 🐹 Set up Go
        id: setup-go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: 📦 Install dependencies
        if: ${{ steps.setup-go.outputs.cache-hit != 'true' }}
        run: go mod download

      - name: 🧪 Run tests
        run: go test -v -race ./... -coverprofile=coverage.txt -covermode=atomic

      - name: ☂️ Upload coverage
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  dry-run-publish:
    name: 🚀 Dry Run Publish
    permissions:
      contents: read
    runs-on: Ubuntu-Slim
    timeout-minutes: 2

    steps:
      - name: 🚚 Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: 🐹 Set up Go
        id: setup-go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: 📦 Install dependencies
        run: go mod download

      - name: 🚀 Dry run publish
        uses: goreleaser/goreleaser-action@v7.3.0
        with:
          args: release --clean --snapshot
